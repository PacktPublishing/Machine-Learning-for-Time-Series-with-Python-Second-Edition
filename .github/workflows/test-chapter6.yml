name: Test chapter 6 notebooks

on:
  push:
    paths:
      - 'chapter6/**'
      - 'pyproject.toml'
      - '.github/workflows/test-chapter6.yml'
  pull_request:
    paths:
      - 'chapter6/**'
      - 'pyproject.toml'
      - '.github/workflows/test-chapter6.yml'
  workflow_dispatch:

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Execute chapter 6 notebooks
        run: |
          mkdir -p /tmp/executed
          status=0
          for nb in chapter6/*.ipynb; do
            echo "::group::Executing $nb"
            if jupyter nbconvert --to notebook --execute "$nb" \
                 --output-dir /tmp/executed \
                 --output "$(basename "${nb%.ipynb}")_executed.ipynb"; then
              echo "OK: $nb"
            else
              echo "::error file=$nb::Notebook execution failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Upload executed notebooks (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chapter6-executed-notebooks
          path: /tmp/executed/
          retention-days: 14
